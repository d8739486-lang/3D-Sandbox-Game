<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Sandbox - Загрузка ассетов</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #111215;
      color: #dedee4;
      font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 28px;
      overflow: hidden;
      border: 1px solid #2e3038;
      box-shadow: inset 0 0 0 1px #1d1f24;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon {
      width: 28px;
      height: 28px;
      background: #1e2026;
      border: 1px solid #3d404a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: #9cb4d8;
    }
    .title-box {
      display: flex;
      flex-direction: column;
    }
    .title {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 11px;
      color: #7a7e8c;
    }
    .center-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .cs2-status {
      font-size: 12px;
      color: #e2e4ea;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
    }
    .cs2-counter {
      font-family: 'Consolas', 'Courier New', monospace;
      color: #9cb4d8;
      font-weight: bold;
    }
    .track {
      width: 100%;
      height: 18px;
      background: #0d0e11;
      border: 1px solid #2a2c33;
      overflow: hidden;
      position: relative;
    }
    .fill {
      height: 100%;
      width: 0%;
      background: #3b6ea5;
      transition: width 0.15s ease-out;
    }
    .details {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      color: #6d7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #555966;
      border-top: 1px solid #1c1e24;
      padding-top: 12px;
    }
    .footer-warning {
      color: #8c909e;
    }
    .footer-countdown {
      font-family: 'Consolas', monospace;
      color: #9cb4d8;
      font-weight: bold;
    }
    .success-badge {
      color: #4ade80 !important;
    }
    .error-badge {
      color: #f87171 !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">■</div>
    <div class="title-box">
      <div class="title">3D SANDBOX UPDATER</div>
      <div class="subtitle">Синхронизация игровых ассетов</div>
    </div>
  </div>

  <div class="center-content">
    <div class="cs2-status">
      <span id="label-action">Подготовка к загрузке...</span>
      <span class="cs2-counter" id="label-counter">0%</span>
    </div>
    <div class="track">
      <div class="fill" id="progress-fill"></div>
    </div>
    <div class="details" id="label-details">Проверка целостности файлов...</div>
  </div>

  <div class="footer">
    <span class="footer-warning" id="label-footer-msg">Пожалуйста, не закрывайте окно...</span>
    <span class="footer-countdown" id="label-countdown"></span>
  </div>

  <script>
    const progressFill = document.getElementById('progress-fill');
    const labelAction = document.getElementById('label-action');
    const labelCounter = document.getElementById('label-counter');
    const labelDetails = document.getElementById('label-details');
    const labelFooterMsg = document.getElementById('label-footer-msg');
    const labelCountdown = document.getElementById('label-countdown');

    let isElectron = false;
    let ipc = null;
    try {
      if (window.require) {
        ipc = window.require('electron').ipcRenderer;
        isElectron = true;
      }
    } catch (_) {}

    if (ipc) {
      // Получаем события от Electron Main процесса
      ipc.on('updater-progress', (event, data) => {
        // data: { percent, text, detail, status }
        if (data.percent !== undefined) {
          progressFill.style.width = Math.min(100, Math.max(0, data.percent)) + '%';
          labelCounter.textContent = `${Math.round(data.percent)}%`;
        }
        if (data.text) labelAction.textContent = data.text;
        if (data.detail) labelDetails.textContent = data.detail;
      });

      ipc.on('updater-complete', (event, data) => {
        progressFill.style.width = '100%';
        labelCounter.textContent = '100%';
        labelAction.textContent = 'Все файлы успешно загружены!';
        labelAction.classList.add('success-badge');
        labelDetails.textContent = 'Запуск игры через несколько секунд...';
        labelFooterMsg.textContent = 'Игра запускается через:';
        
        let secondsLeft = data && data.seconds ? data.seconds : 3;
        labelCountdown.textContent = `${secondsLeft} сек.`;

        const timer = setInterval(() => {
          secondsLeft--;
          if (secondsLeft > 0) {
            labelCountdown.textContent = `${secondsLeft} сек.`;
          } else {
            clearInterval(timer);
            labelCountdown.textContent = '0 сек.';
            ipc.send('updater-finished-launch-game');
          }
        }, 1000);
      });

      ipc.on('updater-error', (event, data) => {
        labelAction.textContent = 'Ошибка загрузки';
        labelAction.classList.add('error-badge');
        labelDetails.textContent = data && data.message ? data.message : 'Не удалось скачать ассеты';
        labelFooterMsg.textContent = 'Запуск игры в автономном режиме через 5 сек...';
        setTimeout(() => {
          ipc.send('updater-finished-launch-game');
        }, 5000);
      });

      // Сообщаем главному процессу, что окно апдейтера готово к загрузке
      ipc.send('updater-ready');
    } else {
      labelDetails.textContent = 'Автономный режим (запуск без Electron)';
    }
  </script>
</body>
</html>
